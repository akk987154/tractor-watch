services:
  tracker:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///data/tractor_watch.db
    command: tractor-watch track

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///data/tractor_watch.db
    command: uvicorn tractor_watch.web:app --host 0.0.0.0 --port 8000
